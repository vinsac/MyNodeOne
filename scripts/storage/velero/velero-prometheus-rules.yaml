# Applied by configure-backup.sh. Metric names are from Velero v1.12.3, the version
# install.sh pins, in pkg/metrics/metrics.go.
#
# The release label is what kube-prometheus-stack's rule and monitor selectors require.
# Without it the operator ignores these objects, with no error.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velero-backup-alerts
  namespace: velero
  labels:
    app: velero
    release: kube-prometheus-stack
spec:
  groups:
  - name: velero.backup.rules
    interval: 5m
    rules:
    # These counters only go up, so increase() is what tells a new failure from an old one.
    - alert: VeleroBackupFailed
      expr: |
        increase(velero_backup_failure_total[24h]) > 0
      labels:
        severity: critical
        component: velero
      annotations:
        summary: "Velero backup failed"
        description: "A backup for schedule '{{ $labels.schedule }}' failed in the last 24 hours (a blank schedule means a manual backup). Check velero backup get, and velero backup logs NAME."

    - alert: VeleroBackupPartialFailure
      expr: |
        increase(velero_backup_partial_failure_total[24h]) > 0
      labels:
        severity: warning
        component: velero
      annotations:
        summary: "Velero backup partial failure"
        description: "A backup for schedule '{{ $labels.schedule }}' finished with some items not backed up in the last 24 hours. Check velero backup describe NAME."

    # This gauge appears after a schedule's first success. Until then, failures show up in
    # VeleroBackupFailed above.
    - alert: VeleroDailyBackupStale
      expr: |
        time() - velero_backup_last_successful_timestamp{schedule="daily-incremental-backup"} > 2 * 86400
      for: 1h
      labels:
        severity: warning
        component: velero
      annotations:
        summary: "No recent daily Velero backup"
        description: "The daily-incremental-backup schedule has had no successful backup in 2 days."

    - alert: VeleroMonthlyBackupStale
      expr: |
        time() - velero_backup_last_successful_timestamp{schedule="monthly-full-backup"} > 35 * 86400
      for: 1h
      labels:
        severity: warning
        component: velero
      annotations:
        summary: "No recent monthly Velero backup"
        description: "The monthly-full-backup schedule has had no successful backup in 35 days."

---
# velero install creates a Deployment but no Service, so a ServiceMonitor has nothing to
# select. It exposes metrics on the pod, on the container port named metrics (8085).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: velero
  namespace: velero
  labels:
    app: velero
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      deploy: velero
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
    path: /metrics
