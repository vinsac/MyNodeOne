apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  namespace: llmapi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 200Gi
# NOTE: vllm-config ConfigMap is created dynamically by install-llmapi.sh
# This allows the install script to set MODEL_NAME and SERVED_MODEL_NAME based on user selection
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm
  namespace: llmapi
  labels:
    app: vllm
spec:
  serviceName: vllm
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # CRITICAL: Required for GPU access in K3s
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.6.6.post1
        ports:
        - containerPort: 8000
          name: http
        command: ["/bin/sh", "-c"]
        args:
        - |
          ARGS="--model $(MODEL_NAME) \
                --max-model-len $(MAX_MODEL_LEN) \
                --gpu-memory-utilization $(GPU_MEMORY_UTILIZATION) \
                --max-num-seqs $(MAX_NUM_SEQS) \
                --host 0.0.0.0 \
                --port 8000 \
                --served-model-name $(SERVED_MODEL_NAME) \
                --trust-remote-code"
          
          # Add quantization if not 'none'
          if [ "$(QUANTIZATION)" != "none" ]; then
            ARGS="$ARGS --quantization $(QUANTIZATION)"
          fi
          
          # Add chunked prefill if enabled
          if [ "$(ENABLE_CHUNKED_PREFILL)" = "true" ]; then
            ARGS="$ARGS --enable-chunked-prefill"
          fi
          
          # Add enforce eager if enabled (helps with OOM)
          if [ "$(ENFORCE_EAGER)" = "true" ]; then
            ARGS="$ARGS --enforce-eager"
          fi
          
          echo "Starting vLLM with: $ARGS"
          exec python3 -m vllm.entrypoints.openai.api_server $ARGS
        envFrom:
        - configMapRef:
            name: vllm-config
        env:
        - name: HF_HOME
          value: "/models"
        - name: TRANSFORMERS_CACHE
          value: "/models"
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        resources:
          requests:
            memory: "16Gi"
            cpu: "4000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8000m"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: models
          mountPath: /models
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 30
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: vllm-models
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llmapi
spec:
  selector:
    app: vllm
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  clusterIP: None
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: vllm-lb
  namespace: llmapi
spec:
  selector:
    app: vllm
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
