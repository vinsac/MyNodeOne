apiVersion: v1
kind: Namespace
metadata:
  name: llmapi
  labels:
    app.kubernetes.io/name: llmapi
    app.kubernetes.io/component: ai-inference
    # Allow hostPath volumes for pre-downloaded model optimization
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: llmapi-quota
  namespace: llmapi
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 256Gi
    limits.memory: 300Gi
    requests.nvidia.com/gpu: "4"
