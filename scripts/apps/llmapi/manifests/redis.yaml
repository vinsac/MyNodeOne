apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: llmapi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: llmapi
  labels:
    app: redis
spec:
  replicas: 1
  # One writer on the ReadWriteOnce volume. rollingUpdate: null clears the default
  # left on Deployments created before this was set; the API rejects the
  # combination otherwise.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        # requirepass goes in through stdin so the password stays out of the pod spec
        # and out of the process arguments. redis-cli reads REDISCLI_AUTH, which
        # covers the probes below and any `kubectl exec ... redis-cli`.
        command:
        - /bin/sh
        - -c
        - |
          exec redis-server - --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru <<EOF
          requirepass ${REDISCLI_AUTH}
          EOF
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: llmapi-redis-auth
              key: password
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: data
          mountPath: /data
        # Check the reply, not the exit code: redis-cli can exit 0 on an error reply,
        # which would hide a NOAUTH. LOADING counts as alive so a large AOF replay
        # is not killed partway, but the pod only becomes Ready on PONG.
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'case "$(redis-cli ping)" in PONG|LOADING*) exit 0;; *) exit 1;; esac'
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - '[ "$(redis-cli ping)" = "PONG" ]'
          initialDelaySeconds: 5
          periodSeconds: 3
          timeoutSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: llmapi
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
