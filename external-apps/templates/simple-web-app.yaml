# External App Example - Simple Web Application
# 
# This demonstrates how to deploy an external app (not in MyNodeOne repo)
# that integrates with MyNodeOne infrastructure
#
# Deploy: kubectl apply -f external-app-simple.yaml
# Register: bash /path/to/MyNodeOne/scripts/lib/register-external-app.sh \
#             --name myexternalapp --subdomain myapp \
#             --namespace myexternalapp --service myexternalapp

---
apiVersion: v1
kind: Namespace
metadata:
  name: myexternalapp
  labels:
    app.kubernetes.io/name: myexternalapp
    app.kubernetes.io/managed-by: external
  annotations:
    description: "External application deployed separately from MyNodeOne repo"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: myexternalapp-html
  namespace: myexternalapp
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>My External App</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          max-width: 800px;
          margin: 50px auto;
          padding: 20px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
          background: white;
          padding: 40px;
          border-radius: 16px;
          box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { 
          color: #667eea; 
          margin-top: 0;
        }
        .badge {
          display: inline-block;
          background: #e8f5e9;
          color: #2e7d32;
          padding: 8px 16px;
          border-radius: 20px;
          font-size: 14px;
          font-weight: 600;
          margin: 10px 5px;
        }
        .info {
          background: #f5f5f5;
          padding: 20px;
          border-radius: 8px;
          margin: 20px 0;
        }
        .code {
          background: #263238;
          color: #aed581;
          padding: 12px;
          border-radius: 4px;
          font-family: 'Monaco', monospace;
          font-size: 13px;
          overflow-x: auto;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>🚀 External App on MyNodeOne</h1>
        
        <div style="margin: 20px 0;">
          <span class="badge">✓ External Deployment</span>
          <span class="badge">✓ MyNodeOne Infrastructure</span>
          <span class="badge">✓ Auto DNS</span>
        </div>
        
        <div class="info">
          <h3>What is this?</h3>
          <p>This is an <strong>external application</strong> - it lives in its own repository, 
          not in the MyNodeOne codebase, but uses MyNodeOne as infrastructure.</p>
        </div>
        
        <h3>Benefits of External Apps</h3>
        <ul>
          <li><strong>Separation</strong> - Keep your SaaS app code private</li>
          <li><strong>Independence</strong> - Your own Git repo, versioning, CI/CD</li>
          <li><strong>Integration</strong> - Automatic DNS, storage, routing via MyNodeOne</li>
          <li><strong>Flexibility</strong> - Deploy any containerized app</li>
        </ul>
        
        <h3>Deployment Pattern</h3>
        <div class="code">
# 1. Deploy your app<br>
kubectl apply -f your-app.yaml<br>
<br>
# 2. Register with MyNodeOne<br>
bash register-external-app.sh \<br>
&nbsp;&nbsp;--name myapp \<br>
&nbsp;&nbsp;--subdomain myapp \<br>
&nbsp;&nbsp;--namespace myapp \<br>
&nbsp;&nbsp;--service myapp<br>
<br>
# 3. Access at http://myapp.mynodeone.local
        </div>
        
        <h3>Infrastructure Provided by MyNodeOne</h3>
        <ul>
          <li>Kubernetes cluster (K3s)</li>
          <li>LoadBalancer (MetalLB)</li>
          <li>Storage (Longhorn)</li>
          <li>Local DNS resolution</li>
          <li>Public routing (via VPS nodes)</li>
          <li>SSL certificates (Let's Encrypt)</li>
        </ul>
        
        <p style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; color: #666; font-size: 14px;">
          <strong>Documentation:</strong> See <code>docs/guides/EXTERNAL-APP-DEPLOYMENT.md</code>
        </p>
      </div>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myexternalapp
  namespace: myexternalapp
  labels:
    app: myexternalapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myexternalapp
  template:
    metadata:
      labels:
        app: myexternalapp
    spec:
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:alpine
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: html
        configMap:
          name: myexternalapp-html

---
apiVersion: v1
kind: Service
metadata:
  name: myexternalapp
  namespace: myexternalapp
  annotations:
    # MyNodeOne integration via annotations
    mynodeone.io/subdomain: "myapp"
    mynodeone.io/auto-register: "true"
    mynodeone.io/public: "false"
    description: "Example external app demonstrating MyNodeOne integration pattern"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: myexternalapp

---
# Optional: Auto-scaling for production workloads
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myexternalapp-hpa
  namespace: myexternalapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myexternalapp
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
