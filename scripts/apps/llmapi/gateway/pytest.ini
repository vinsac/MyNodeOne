[pytest]
testpaths = tests
# A regression in a time limit shows up as a test that never returns, so every test
# gets a limit of its own. The slowest one takes about 7s with a load average of 50.
timeout = 60
# "signal" would let the other tests go on, but it only raises in the test, and
# asyncio.run then waits forever for a task that ignores cancellation. "thread" prints
# every stack and ends the run with exit 1, whatever the test is stuck in.
timeout_method = thread
required_plugins = pytest-timeout
