# NVIDIA Device Plugin for Kubernetes
# Source: https://github.com/NVIDIA/k8s-device-plugin
# Version: v0.14.5
#
# This DaemonSet runs on all GPU nodes and exposes GPUs as schedulable resources.
# Pods can request GPUs using: resources.limits.nvidia.com/gpu: 1
#
# The plugin runs locally and does NOT require internet connectivity.
# GPU resources are exposed as "nvidia.com/gpu" on each node.

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.14.5
          name: nvidia-device-plugin-ctr
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
