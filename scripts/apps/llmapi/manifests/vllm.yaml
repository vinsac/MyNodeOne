apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  namespace: llmapi
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 200Gi
# NOTE: vllm-config ConfigMap is created dynamically by install-llmapi.sh
# This allows the install script to set MODEL_NAME and SERVED_MODEL_NAME based on user selection
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm
  namespace: llmapi
  labels:
    app: vllm
spec:
  serviceName: vllm
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # CRITICAL: Required for GPU access in K3s
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      # Set fsGroup to ensure both containers can write to /models volume
      # Init container runs as root to install packages, fsGroup gives it write access
      securityContext:
        fsGroup: 1000
      # Init container to pre-download model before vLLM starts
      # This ensures model is cached and vLLM startup is fast
      initContainers:
      - name: model-downloader
        # Use slim Python image and install huggingface_hub
        image: python:3.11-slim-bookworm
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "=== vLLM Model Pre-Download ==="
          echo "Model: $MODEL_NAME"
          echo "HF Token configured: $([ -n \"$HUGGING_FACE_HUB_TOKEN\" ] && echo 'yes' || echo 'no')"
          
          # Model name without org prefix for directory matching
          MODEL_SHORT=$(echo "$MODEL_NAME" | sed 's|.*/||' | tr '[:upper:]' '[:lower:]')
          
          # 1. Check if model already cached in PVC (from previous run)
          CACHE_DIR="/models/models--$(echo $MODEL_NAME | tr '/' '--')"
          CACHE_DIR_HUB="/models/hub/models--$(echo $MODEL_NAME | tr '/' '--')"
          
          for DIR in "$CACHE_DIR" "$CACHE_DIR_HUB"; do
            if [ -d "$DIR/snapshots" ] && [ "$(ls -A $DIR/snapshots 2>/dev/null)" ]; then
              CACHED_SIZE=$(du -sh "$DIR" 2>/dev/null | cut -f1)
              echo "Checking PVC cache at $DIR ($CACHED_SIZE)..."
              if find "$DIR" -name "*.safetensors" 2>/dev/null | head -1 | grep -q .; then
                echo "✓ Model weights found in PVC. Skipping download."
                exit 0
              fi
            fi
          done
          
          # 2. Check for pre-downloaded model on host (mounted at /predownload)
          echo ""
          echo "Checking for pre-downloaded model on host..."
          for HOST_DIR in /predownload/vllm/*; do
            if [ -d "$HOST_DIR" ]; then
              HOST_MODEL=$(basename "$HOST_DIR" | tr '[:upper:]' '[:lower:]')
              if echo "$MODEL_SHORT" | grep -qi "$HOST_MODEL" || echo "$HOST_MODEL" | grep -qi "$MODEL_SHORT"; then
                HOST_SIZE=$(du -sh "$HOST_DIR" 2>/dev/null | cut -f1)
                echo "Found pre-downloaded model: $HOST_DIR ($HOST_SIZE)"
                # Verify it has actual model files
                if find "$HOST_DIR" -name "*.safetensors" 2>/dev/null | head -1 | grep -q .; then
                  echo "✓ Model weights found. Copying to PVC..."
                  # Copy to PVC maintaining HuggingFace cache structure
                  mkdir -p /models/hub
                  cp -r "$HOST_DIR" "/models/hub/$(basename "$HOST_DIR")"
                  FINAL_SIZE=$(du -sh /models 2>/dev/null | cut -f1)
                  echo "✓ Copy complete. PVC cache size: $FINAL_SIZE"
                  exit 0
                fi
              fi
            fi
          done
          
          # 3. Download from HuggingFace
          echo ""
          echo "No cached model found. Downloading from HuggingFace..."
          
          # Install huggingface_hub with hf_transfer for faster downloads
          echo "Installing huggingface_hub..."
          pip install --quiet --no-cache-dir huggingface_hub hf_transfer
          export HF_HUB_ENABLE_HF_TRANSFER=1
          
          echo ""
          echo "Using hf_transfer for accelerated download (up to 500 MB/s)"
          echo ""
          
          # Download with resume support and progress using Python API
          python3 << 'PYEOF'
          import os
          from huggingface_hub import snapshot_download
          
          model_name = os.environ.get("MODEL_NAME")
          token = os.environ.get("HUGGING_FACE_HUB_TOKEN")
          
          print(f"Downloading {model_name}...")
          snapshot_download(
              repo_id=model_name,
              cache_dir="/models",
              token=token if token else None,
              resume_download=True
          )
          print("Download complete!")
          PYEOF
          
          # Verify download
          if find "/models" -name "*.safetensors" 2>/dev/null | head -1 | grep -q .; then
            FINAL_SIZE=$(du -sh /models 2>/dev/null | cut -f1)
            echo ""
            echo "Total cache size: $FINAL_SIZE"
            
            # CRITICAL: Fix permissions for vLLM container to write lock files
            # Set ownership to 1000:1000 (vLLM user) and make writable
            echo "Fixing permissions for vLLM container..."
            chown -R 1000:1000 /models
            chmod -R 755 /models
            echo "✓ Permissions fixed"
          else
            echo "ERROR: Model download may have failed."
            exit 1
          fi
        env:
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: vllm-config
              key: MODEL_NAME
        - name: HF_HOME
          value: "/models"
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.6.6.post1
        ports:
        - containerPort: 8000
          name: http
        command: ["/bin/sh", "-c"]
        args:
        - |
          ARGS="--model $(MODEL_NAME) \
                --max-model-len $(MAX_MODEL_LEN) \
                --gpu-memory-utilization $(GPU_MEMORY_UTILIZATION) \
                --max-num-seqs $(MAX_NUM_SEQS) \
                --host 0.0.0.0 \
                --port 8000 \
                --served-model-name $(SERVED_MODEL_NAME) \
                --trust-remote-code"
          
          # Add quantization if not 'none'
          if [ "$(QUANTIZATION)" != "none" ]; then
            ARGS="$ARGS --quantization $(QUANTIZATION)"
          fi
          
          # Add chunked prefill if enabled
          if [ "$(ENABLE_CHUNKED_PREFILL)" = "true" ]; then
            ARGS="$ARGS --enable-chunked-prefill"
          fi
          
          # Add enforce eager if enabled (helps with OOM)
          if [ "$(ENFORCE_EAGER)" = "true" ]; then
            ARGS="$ARGS --enforce-eager"
          fi
          
          echo "Starting vLLM with: $ARGS"
          exec python3 -m vllm.entrypoints.openai.api_server $ARGS
        envFrom:
        - configMapRef:
            name: vllm-config
        env:
        - name: HF_HOME
          value: "/models"
        - name: TRANSFORMERS_CACHE
          value: "/models"
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        resources:
          requests:
            memory: "16Gi"
            cpu: "4000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8000m"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: models
          mountPath: /models
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        # Dynamic startup probe: Model is pre-downloaded by init container
        # so startup only needs time for GPU loading (~2-5 min for most models)
        # Formula: initialDelay=30s + failureThreshold(60) * period(10s) = 630s = 10.5 min max
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 60
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: vllm-models
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llmapi
spec:
  selector:
    app: vllm
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  clusterIP: None
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: vllm-lb
  namespace: llmapi
spec:
  selector:
    app: vllm
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
