apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: llmapi
data:
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_HOST: "llmapi-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "llmapi"
  POSTGRES_USER: "llmapi"
  VLLM_URLS: "http://vllm-0.vllm:8000,http://vllm-1.vllm:8000"
  LLAMACPP_URL: "http://llamacpp:8080"
  EMBEDDING_URL: "http://embedding:8080"
  OLLAMA_URL: "http://ollama:11434"
  # Model names for discovery (llama.cpp/embedding don't have /v1/models)
  LLAMACPP_MODEL_NAME: "llama-cpu"
  EMBEDDING_MODEL_NAME: "embedding"
  # Default quotas
  DEFAULT_REQUESTS_PER_MINUTE: "60"
  DEFAULT_TOKENS_PER_DAY: "100000"
  # Lazy loading (Ollama backend)
  LAZY_LOAD_ENABLED: "true"
  LAZY_LOAD_BACKEND: "ollama"
  AUTO_DOWNLOAD: "false"
  # Horizontal scaling: route to the least-loaded backend that serves the model.
  # Same model on vLLM + llama.cpp => GPU first, then CPU spillover.
  # vLLM-only model => never spills to llama.cpp; returns 429 when GPUs are full.
  HORIZONTAL_SCALING: "true"
  MAX_INFLIGHT_PER_BACKEND: "32"
  MAX_INFLIGHT_PER_VLLM_BACKEND: "2"
  MAX_INFLIGHT_PER_EMBEDDING_BACKEND: "4"
  MAX_INFLIGHT_PER_LLAMACPP_BACKEND: "1"
  MAX_INFLIGHT_PER_OLLAMA_BACKEND: "1"
  # Rate limiting
  CONCURRENCY_PER_GPU: "2"
  CONCURRENCY_PER_KEY_DEFAULT: "2"
  CONCURRENCY_PER_EMBEDDING_REPLICA: "4"
  CONCURRENCY_PER_LLAMACPP_REPLICA: "1"
  CONCURRENCY_PER_OLLAMA_REPLICA: "1"
  # NOTE: The TTL knobs below are LEGACY. The slot-based limiter introduced in
  # the gateway redesign no longer prunes leases on a wall-clock timer; leases
  # are tied to the lifetime of the owning asyncio.Task and reaped by the
  # SLOT_RECONCILE_INTERVAL_SECONDS loop. Kept here as no-ops for rollback.
  CONCURRENCY_LEASE_TTL_SECONDS: "600"
  BACKEND_INFLIGHT_LEASE_TTL_SECONDS: "600"
  # New: how often the task-liveness reaper runs (seconds). 5s is the sweet
  # spot — fast enough that a leaked slot self-heals before retries pile up,
  # slow enough that the lock-contention overhead is negligible.
  SLOT_RECONCILE_INTERVAL_SECONDS: "5"
  # Optional: scrape vLLM's /metrics every N seconds and log a warning if the
  # gateway's slot count disagrees with vllm:num_requests_running. Audit only;
  # gateway is still the source of truth. Set to "false" to disable.
  RECONCILE_VLLM_METRICS: "true"
  RECONCILE_VLLM_METRICS_INTERVAL_SECONDS: "15"
  # Upstream HTTP timeout for forwarded inference requests. Clients should set
  # their own read timeout to >= this value.
  BACKEND_HTTP_TIMEOUT_SECONDS: "300"
  DEFAULT_TOKENS_PER_MINUTE: "200000"
  MIN_TOKENS_PER_MINUTE: "200000"
  DEFAULT_EMBEDDING_REQUESTS_PER_MINUTE: "60"
  DEFAULT_EMBEDDING_TOKENS_PER_MINUTE: "200000"
  DEFAULT_LLAMACPP_REQUESTS_PER_MINUTE: "60"
  DEFAULT_LLAMACPP_TOKENS_PER_MINUTE: "200000"
  DEFAULT_OLLAMA_REQUESTS_PER_MINUTE: "60"
  DEFAULT_OLLAMA_TOKENS_PER_MINUTE: "200000"
  ADMIN_DEFAULT_TOKENS_PER_MINUTE: "200000"
  # Admin password (change this!)
  ADMIN_PASSWORD: "admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: llmapi
  labels:
    app: llmapi-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmapi-gateway
  template:
    metadata:
      labels:
        app: llmapi-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: mynodeone-app
      serviceAccountName: gateway
      securityContext:
        allowPrivilegeEscalation: false
      initContainers:
      - name: install-deps
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --target=/app/deps fastapi uvicorn httpx redis pydantic prometheus-client python-multipart kubernetes asyncpg sqlalchemy --quiet
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: app-deps
          mountPath: /app/deps
      containers:
      - name: gateway
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          export PYTHONPATH=/app/deps
          cd /app && python -m uvicorn main:app --host 0.0.0.0 --port 8000
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: llmapi-db
              key: postgres-password
        envFrom:
        - configMapRef:
            name: gateway-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5
        volumeMounts:
        - name: gateway-code
          mountPath: /app/main.py
          subPath: main.py
        - name: app-deps
          mountPath: /app/deps
      volumes:
      - name: gateway-code
        configMap:
          name: gateway-code
      - name: app-deps
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llmapi
  namespace: llmapi
  annotations:
    mynodeone.io/subdomain: "llmapi"
spec:
  selector:
    app: llmapi-gateway
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: llmapi-internal
  namespace: llmapi
spec:
  selector:
    app: llmapi-gateway
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
