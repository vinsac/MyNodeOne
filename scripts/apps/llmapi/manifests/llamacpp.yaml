apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llamacpp-models
  namespace: llmapi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 300Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-config
  namespace: llmapi
data:
  # Default model (matches install script default - will be overridden during installation)
  MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-14B-Instruct-GGUF/resolve/main/Qwen2.5-14B-Instruct-Q4_K_M.gguf"
  MODEL_FILE: "Qwen2.5-14B-Instruct-Q4_K_M.gguf"
  
  # ==========================================================================
  # Context & Memory Configuration (256GB RAM system)
  # ==========================================================================
  
  # Context size (tokens). Each token uses ~0.5-1KB RAM depending on model.
  # 70B Q4 model + 32K context ≈ 60GB RAM total
  # With 256GB RAM, you can safely use 32768 or higher.
  CONTEXT_SIZE: "32768"
  
  # Batch size for prompt processing. Higher = faster prompt processing.
  # Should not exceed context size. 2048-4096 is typical.
  BATCH_SIZE: "4096"
  
  # CPU threads. Set to physical core count (not hyperthreads).
  # For 16-core CPU, use 16.
  THREADS: "16"
  
  # GPU offload layers (0 = CPU only, -1 = all layers to GPU)
  # For pure CPU inference with 70B model, keep at 0.
  # If you have spare VRAM, set to 10-20 for hybrid inference.
  GPU_LAYERS: "0"
  
  # Number of parallel request slots. Each slot reserves context memory.
  # parallel=4 with context=32768 means 4 concurrent 32K conversations.
  # RAM usage ≈ model_size + (parallel × context × bytes_per_token)
  PARALLEL: "4"
  
  # Chat template (must match model)
  # Options: llama2, llama3, chatml, alpaca, vicuna, mistral
  CHAT_TEMPLATE: "llama3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  namespace: llmapi
  labels:
    app: llamacpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamacpp
  template:
    metadata:
      labels:
        app: llamacpp
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Download model if not present - uses wget with resume support
      - name: model-downloader
        # Use alpine with wget pre-installed (supports resume)
        image: alpine:3.19
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - /bin/sh
        - -c
        - |
          set -e
          MODEL_PATH="/models/${MODEL_FILE}"
          
          echo "=== llama.cpp Model Downloader ==="
          echo "Model URL: ${MODEL_URL}"
          echo "Target: ${MODEL_PATH}"
          echo "HF Token: $([ -n \"${HF_TOKEN:-}\" ] && echo 'configured' || echo 'not set')"
          
          # 1. Check if model already exists in PVC
          if [ -f "$MODEL_PATH" ]; then
            EXISTING_SIZE=$(stat -c%s "$MODEL_PATH" 2>/dev/null || echo 0)
            echo "Existing file found: $(echo $EXISTING_SIZE | awk '{printf "%.1fG", $1/1024/1024/1024}')"
            
            # For pre-copied models, skip size validation if file is reasonably large (>50MB)
            # This handles cases where URL validation fails (404 errors) but model was copied successfully
            # 50MB threshold catches most legitimate models while avoiding partial downloads
            if [ "$EXISTING_SIZE" -gt 52428800 ]; then  # 50MB threshold
              echo "✓ Pre-downloaded model detected ($(echo $EXISTING_SIZE | awk '{if($1>=1073741824) printf "%.1fG", $1/1073741824; else printf "%.0fM", $1/1048576}')). Skipping download."
              exit 0
            fi
            
            # Try URL validation for smaller files or if explicitly needed
            echo "Validating file completeness..."
            if [ -n "${HF_TOKEN:-}" ]; then
              EXPECTED_SIZE=$(wget --spider --header="Authorization: Bearer ${HF_TOKEN}" -S "${MODEL_URL}" 2>&1 | grep -i "Content-Length" | tail -1 | awk '{print $2}' || echo "")
            else
              EXPECTED_SIZE=$(wget --spider -S "${MODEL_URL}" 2>&1 | grep -i "Content-Length" | tail -1 | awk '{print $2}' || echo "")
            fi
            
            if [ -n "$EXPECTED_SIZE" ]; then
              echo "Expected size: $(echo $EXPECTED_SIZE | awk '{printf "%.1fG", $1/1024/1024/1024}')"
              if [ "$EXISTING_SIZE" -ge "$EXPECTED_SIZE" ]; then
                echo "✓ Model already complete. Skipping download."
                exit 0
              else
                echo "Incomplete download detected. Will resume..."
              fi
            else
              echo "⚠ Cannot validate file size (URL check failed), but file exists ($(echo $EXISTING_SIZE | awk '{if($1>=1073741824) printf "%.1fG", $1/1073741824; else printf "%.0fM", $1/1048576}'))"
              # Apply same 50MB threshold for URL validation failures
              if [ "$EXISTING_SIZE" -gt 52428800 ]; then  # 50MB threshold
                echo "✓ File is substantial (>50MB). Assuming pre-copied model is complete. Skipping download."
                exit 0
              else
                echo "⚠ File is small (<50MB). May be incomplete. Will attempt download."
              fi
            fi
          fi
          
          # 2. Skip predownload check (models should be copied by install script)
          echo ""
          echo "Proceeding with download if model not found in PVC..."
          echo ""
          echo "No cached model found. Downloading from URL..."
          echo "This may take 30-60 minutes for a 40GB model."
          echo ""
          
          # Download with resume support (-c) - BusyBox wget doesn't support --progress
          if [ -n "${HF_TOKEN:-}" ]; then
            wget -c \
              --header="Authorization: Bearer ${HF_TOKEN}" \
              -O "$MODEL_PATH" \
              "${MODEL_URL}"
          else
            wget -c \
              -O "$MODEL_PATH" \
              "${MODEL_URL}"
          fi
          
          # Verify download
          if [ -f "$MODEL_PATH" ]; then
            FINAL_SIZE=$(stat -c%s "$MODEL_PATH")
            echo ""
            echo "✓ Download complete! Size: $(echo $FINAL_SIZE | awk '{printf "%.1fG", $1/1024/1024/1024}')"
          else
            echo "ERROR: Download failed!"
            exit 1
          fi
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        envFrom:
        - configMapRef:
            name: llamacpp-config
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      containers:
      - name: llamacpp
        image: ghcr.io/ggml-org/llama.cpp:server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http
        args:
        - "--model"
        - "/models/$(MODEL_FILE)"
        - "--ctx-size"
        - "$(CONTEXT_SIZE)"
        - "--batch-size"
        - "$(BATCH_SIZE)"
        - "--threads"
        - "$(THREADS)"
        - "--parallel"
        - "$(PARALLEL)"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        # Use model's built-in jinja chat template (Llama 3.1 has it embedded)
        - "--jinja"
        envFrom:
        - configMapRef:
            name: llamacpp-config
        resources:
          requests:
            memory: "64Gi"
            cpu: "8000m"
          limits:
            memory: "180Gi"
            cpu: "24000m"
        volumeMounts:
        - name: models
          mountPath: /models
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 20
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: llamacpp-models
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  namespace: llmapi
spec:
  selector:
    app: llamacpp
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
