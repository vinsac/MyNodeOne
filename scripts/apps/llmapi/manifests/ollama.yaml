# Ollama - Experimentation Backend
# Supports: dynamic model loading, VRAM→RAM overflow, model caching
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: llmapi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti  # Cache for multiple large models
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llmapi
  labels:
    app: llmapi-ollama
spec:
  # Start with 0 replicas (offline) to avoid reserving RAM
  # Scale up via Admin UI when needed: POST /admin/backend/ollama/scale with replicas: 1
  replicas: 0
  selector:
    matchLabels:
      app: llmapi-ollama
  template:
    metadata:
      labels:
        app: llmapi-ollama
    spec:
      # CPU-only mode (vLLM uses the GPU)
      securityContext:
        runAsNonRoot: false  # Ollama needs root for model access
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ollama
        image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
        ports:
        - containerPort: 11434
          name: http
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        # Keep models loaded for 30 min before unloading
        - name: OLLAMA_KEEP_ALIVE
          value: "30m"
        # Allow models to use all available VRAM + overflow to RAM
        - name: OLLAMA_NUM_PARALLEL
          value: "4"
        # HuggingFace token for gated models. Optional: nothing creates this Secret by
        # default any more, and an existing one is left as it is.
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: llmapi-secrets
              key: hf-token
              optional: true
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "8Gi"
            cpu: "2000m"
          limits:
            memory: "64Gi"  # Allow RAM for CPU inference
            cpu: "16000m"
            # No GPU - vLLM uses the GPU, Ollama runs on CPU
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llmapi
spec:
  selector:
    app: llmapi-ollama
  ports:
  - port: 11434
    targetPort: 11434
    name: http
  type: ClusterIP
