# Example alert destination. Nothing reads this file.
#
# To turn on alert delivery:
#   1. sudo install -m 600 -o root -g root alertmanager-values.example.yaml /etc/mynodeone/alertmanager-values.yaml
#   2. Edit that copy: uncomment one receiver and put in your own destination.
#   3. sudo ./apply-monitoring-config.sh
#
# Alternatively point ALERTMANAGER_VALUES_FILE at a file somewhere else. Without any
# such file, Alertmanager keeps the chart's default 'null' receiver, and alerts are
# visible in Prometheus and Alertmanager but are not sent anywhere.
#
# Keep the file root-only: webhook URLs and SMTP passwords are credentials.

# alertmanager:
#   config:
#     route:
#       receiver: my-destination
#       group_by: ['namespace', 'alertname']
#       group_wait: 30s
#       group_interval: 5m
#       repeat_interval: 12h
#       routes:
#         # Watchdog fires all the time on purpose, so don't send it anywhere.
#         - receiver: 'null'
#           matchers:
#             - alertname = "Watchdog"
#     receivers:
#       - name: 'null'
#       - name: my-destination
#         # Webhook:
#         webhook_configs:
#           - url: https://REPLACE-ME.invalid/alerts
#         # Or email:
#         # email_configs:
#         #   - to: REPLACE-ME@example.invalid
#         #     from: REPLACE-ME@example.invalid
#         #     smarthost: smtp.example.invalid:587
#         #     auth_username: REPLACE-ME
#         #     auth_password: REPLACE-ME
